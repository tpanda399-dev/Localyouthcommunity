<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Local Youth Community</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .register {
      text-align: center;
      margin-top: 20px;
    }

    .register a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .home {
      text-align: center;
      margin-top: 15px;
    }

    .home a {
      color: #6b7280;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Welcome Back 👋</h1>

    <p class="subtitle">
      Local Youth Community
    </p>

    <form id="loginForm">

      <label>Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      New member?
      <a href="register.html">Create Account</a>
    </div>

    <div class="home">
      <a href="index.html">← Back to Home</a>
    </div>

  </div>

  <script>
    // Supabase connection will be added in the next step.
  </script>

</body>
</html>
