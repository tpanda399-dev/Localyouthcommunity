<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Local Youth Community</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 25px 15px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Join Our Community 👥</h1>

    <p class="subtitle">
      Local Youth Community
    </p>

    <form id="registerForm">

      <label>Full Name</label>
      <input type="text" id="full_name" required>

      <label>Date of Birth</label>
      <input type="date" id="date_of_birth" required>

      <label>Mobile Number</label>
      <input type="tel" id="mobile" required>

      <label>Email Address</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" minlength="6" required>

      <label>Local Area</label>
      <input type="text" id="local_area" required>

      <label>Short Bio</label>
      <textarea id="bio" placeholder="Tell us something about yourself"></textarea>

      <button type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <script>
    // Supabase connection will be added in the next step.
  </script>

</body>
</html>
